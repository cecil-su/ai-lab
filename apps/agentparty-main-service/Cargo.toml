[package]
name = "agentparty-main-service"
version = "0.1.0"
edition = "2021"
description = "AgentParty intranet main service foundation"
license = "MIT"

[[bin]]
name = "agentparty-main-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
ts-rs = { version = "11", features = ["serde-compat"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
