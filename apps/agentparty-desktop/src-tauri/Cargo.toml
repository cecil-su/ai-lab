[package]
name = "agentparty-desktop"
version = "0.0.0"
description = "AgentParty desktop workbench"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2" }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
